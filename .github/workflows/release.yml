name: Build and publish desktop release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Checkout backend repository
        shell: powershell
        run: git clone https://github.com/fiskedxd/backend-tavora.git backend

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install backend production dependencies
        run: npm install --prefix backend --omit=dev

      - name: Remove stale workspace junction
        shell: powershell
        run: |
          $junction = Join-Path $env:GITHUB_WORKSPACE 'backend\node_modules\tavora-desktop'
          if ([System.IO.Directory]::Exists($junction)) {
            cmd.exe /c "rmdir /s /q `"$junction`""
          }

      - name: Enable Windows developer mode
        shell: powershell
        run: Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Type DWord -Value 1

      - name: Build installer
        run: npm run build -- --publish never

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Tavora Setup *.exe
            dist/Tavora Setup *.exe.blockmap
            dist/latest.yml